pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'TConstruct'

def mantleProjectDir = file('../Mantle-1.21.1')
if (!mantleProjectDir.isDirectory()) {
    throw new GradleException("Mantle project not found at ${mantleProjectDir}. Place Mantle-1.21.1 next to this project.")
}

include 'mantle'
project(':mantle').projectDir = mantleProjectDir